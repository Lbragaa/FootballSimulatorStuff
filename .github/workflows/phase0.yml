name: History, accepted checkpoints and chronological world
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python tools/bootstrap_handoff.py
      - run: python tools/bootstrap_accepted.py --download --output output/ci-accepted
      - run: python -m braga_era inspect
      - run: python -m braga_era audit
      - run: python -m braga_era inspect --db output/ci-accepted/database.sqlite
      - run: python -m braga_era audit --db output/ci-accepted/database.sqlite
      - run: python -m pytest --junitxml output/ci-tests.xml
      - run: python -m braga_era sandbox --db output/ci-accepted/database.sqlite --output output/ci-real-match --seed task03a-engine-smoke --fixture league:333
      - run: python -m braga_era sandbox --db output/ci-accepted/database.sqlite --output output/ci-vasco-synthetic --seed task03a-vasco-synthetic --synthetic
      - run: python tools/verify_engine_demos.py --directory output/ci-real-match --reference docs/demos/league333.json
      - run: python tools/verify_engine_demos.py --directory output/ci-vasco-synthetic --reference docs/demos/vasco_synthetic.json
      - run: python -m braga_era world demo --db output/ci-accepted/database.sqlite --output output/ci-world --seed task03b-world-demo-v1
      - run: python tools/verify_world_demo.py --directory output/ci-world --reference docs/validation/task03b_demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: NONCANONICAL-world-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            output/ci-world/NONCANONICAL_DEV_03B.zip
            output/ci-world/demonstration.json
            output/ci-world/reports/*
            output/ci-tests.xml
      - uses: actions/upload-artifact@v4
        with:
          name: noncanonical-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            output/ci-real-match/*.json
            output/ci-real-match/*.jsonl
            output/ci-vasco-synthetic/*.json
            output/ci-vasco-synthetic/*.jsonl
      - run: python -m braga_era save create --output output/ci-046C
      - run: python -m braga_era audit --profile 046C --db output/ci-046C/database.sqlite --parent data/handoff/canonical/braga_save.sqlite
      - run: python -m braga_era save export output/ci-046C --output output/ci-046C.zip
      - run: python -m braga_era save restore output/ci-046C.zip --output output/ci-restored
      - run: python -m braga_era save verify output/ci-restored

      - run: python tools/stress_season.py --db output/ci-accepted/database.sqlite --output output/ci-season --seed task03c-final-a-fixed-v1 --no-package
      - run: python tools/verify_season.py output/ci-season --reference docs/validation/task03c_season.json
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/stress_season.py --db output/ci-accepted/database.sqlite --output output/ci-season --seed task03c-final-a-fixed-v1
      - uses: actions/upload-artifact@v4
        with:
          name: NONCANONICAL-season-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            output/ci-season/private_season_report.json
            output/ci-season/mirassol_preview.json
            output/ci-season.zip
            output/ci-tests.xml
