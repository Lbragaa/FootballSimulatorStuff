[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braga-era"
version = "0.1.0"
description = "Read-only preservation and auditing of The Braga Era canonical universe"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
braga-era = "braga_era.cli:main"

[tool.setuptools.packages.find]
include = ["braga_era*"]

[tool.setuptools.package-data]
braga_era = ["baselines/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
